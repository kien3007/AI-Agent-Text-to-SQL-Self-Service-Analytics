version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agent_backend
    ports:
      - "8000:8000"
    environment:
      - API_KEY_QWEN_3=your_qwen3_api_key
      - API_KEY_QWEN_2_5_CODER=your_qwen25_coder_api_key
      - WAREHOUSE_BACKEND=duckdb
      - DUCKDB_PATH=/app/data/warehouse.duckdb
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_STORAGE_DIR=/app/data/qdrant_db
      - VECTOR_DB_BACKEND=qdrant
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./dataset:/app/dataset
      - ./backend:/app/backend
      - ./infra/dbt:/app/infra/dbt
    depends_on:
      - qdrant
    networks:
      - ai_data_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_vectordb
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - ai_data_net

volumes:
  qdrant_storage:

networks:
  ai_data_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
