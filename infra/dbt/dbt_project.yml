name: 'analytics_project'
version: '1.0.0'
config-version: 2

# Profile được chọn theo biến môi trường DBT_PROFILE (mặc định duckdb_profile cho dev/test)
profile: "{{ env_var('DBT_PROFILE', 'duckdb_profile') }}"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  analytics_project:
    staging:
      +materialized: view
    marts:
      +materialized: table
