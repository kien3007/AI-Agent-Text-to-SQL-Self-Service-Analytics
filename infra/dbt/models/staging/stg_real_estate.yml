version: 2

sources:
  - name: raw_data
    database: real_estate_analytics
    tables:
      - name: real_estate_listings
        description: "Bảng dữ liệu tin đăng bất động sản gốc (3.5 triệu dòng)"

models:
  - name: stg_real_estate
    description: "Bảng dữ liệu tin đăng bất động sản đã được làm sạch, lọc bỏ giá trị âm/null và chuẩn hóa thời gian."
    columns:
      - name: listing_title
        description: "Tiêu đề tin đăng bất động sản"
      - name: property_type_name
        description: "Loại hình BĐS: Căn hộ chung cư, Nhà, Đất, Biệt thự/Nhà liền kề, Shophouse"
        tests:
          - not_null
      - name: province_name
        description: "Tỉnh / Thành phố trực thuộc trung ương"
        tests:
          - not_null
      - name: district_name
        description: "Quận / Huyện / Thị xã"
        tests:
          - not_null
      - name: price_vnd
        description: "Giá bán niêm yết (VNĐ)"
        tests:
          - not_null
      - name: area_sqm
        description: "Diện tích sử dụng (m2)"
        tests:
          - not_null
      - name: price_per_sqm
        description: "Đơn giá trên mỗi mét vuông (VNĐ/m2)"
      - name: published_at
        description: "Thời điểm xuất bản tin đăng (Partition Key)"
        tests:
          - not_null
      - name: published_year_month
        description: "Tháng xuất bản định dạng YYYY-MM"
