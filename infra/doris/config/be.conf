# Apache Doris Backend (BE) Configuration - Optimized for 16GB RAM
# Hard limit for BE memory usage: 1.5GB
mem_limit = 1536M

# Page cache and memory buffers - scaled down for low-memory environment
storage_page_cache_limit = 128M
chunk_reserved_bytes_limit = 128M
disable_storage_page_cache = false

# Storage Root Path
storage_root_path = /opt/apache-doris/be/storage

# Ports
be_port = 9060
webserver_port = 8040
heartbeat_service_port = 9050
brpc_port = 8060

# Logging
sys_log_level = INFO
sys_log_roll_mode = SIZE-MB-1024
sys_log_roll_num = 3
