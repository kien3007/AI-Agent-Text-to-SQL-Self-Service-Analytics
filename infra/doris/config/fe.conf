# Apache Doris Frontend (FE) Configuration - Optimized for 16GB RAM
# Max Heap: 1024MB, Min Heap: 512MB
JAVA_OPTS="-Xmx1024m -Xms512m -XX:+UseG1GC -Xlog:gc*"

# HTTP and MySQL Protocol Ports
http_port = 8030
query_port = 9030
edit_log_port = 9010

# Metadata Storage Path
meta_dir = /opt/apache-doris/fe/doris-meta

# System settings
sys_log_level = INFO
sys_log_roll_mode = SIZE-MB-1024
sys_log_roll_num = 3
