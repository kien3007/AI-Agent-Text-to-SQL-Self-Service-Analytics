tables:
  customers:
    table_name: "customers"
    vn_name: "Khách hàng"
    description: "Bảng lưu trữ thông tin tài khoản người mua hàng"
    primary_key: ["id"]
    columns:
      id:
        name: "id"
        vn_name: "Mã khách hàng"
        en_name: "Customer ID"
        data_type: "BIGINT"
        description: "Khóa chính định danh duy nhất khách hàng"
        is_primary_key: true
        synonyms: ["mã khách", "id khách", "khách hàng"]
      name:
        name: "name"
        vn_name: "Tên khách hàng"
        en_name: "Customer Name"
        data_type: "VARCHAR(100)"
        description: "Họ và tên của khách hàng"
        synonyms: ["tên khách", "họ tên", "người mua"]
      province:
        name: "province"
        vn_name: "Tỉnh / Thành phố"
        en_name: "Province"
        data_type: "VARCHAR(100)"
        description: "Tỉnh thành phố địa chỉ giao hàng của khách"
        synonyms: ["tỉnh", "thành phố", "khu vực"]
      registration_date:
        name: "registration_date"
        vn_name: "Ngày đăng ký tài khoản"
        en_name: "Registration Date"
        data_type: "DATE"
        description: "Ngày khách hàng tạo tài khoản"
        synonyms: ["ngày đăng ký", "năm nay", "đăng ký"]

  orders:
    table_name: "orders"
    vn_name: "Đơn hàng"
    description: "Bảng thông tin đơn hàng mua sắm"
    primary_key: ["id"]
    partition_key: "created_at"
    columns:
      id:
        name: "id"
        vn_name: "Mã đơn hàng"
        en_name: "Order ID"
        data_type: "BIGINT"
        description: "Khóa chính định danh đơn hàng"
        is_primary_key: true
        synonyms: ["mã đơn", "số đơn", "đơn hàng"]
      customer_id:
        name: "customer_id"
        vn_name: "Mã khách hàng"
        en_name: "Customer ID"
        data_type: "BIGINT"
        description: "Khóa ngoại liên kết tới bảng customers"
        foreign_key: "customers.id"
        synonyms: ["khách hàng", "người đặt"]
      status:
        name: "status"
        vn_name: "Trạng thái đơn hàng"
        en_name: "Order Status"
        data_type: "VARCHAR(50)"
        description: "Trạng thái đơn: COMPLETED (Hoàn thành), CANCELLED (Bị hủy), PENDING (Đang xử lý)"
        synonyms: ["trạng thái", "tình trạng đơn", "đơn hủy", "thành công"]
        sample_values: ["COMPLETED", "CANCELLED", "PENDING"]
      total_amount:
        name: "total_amount"
        vn_name: "Tổng giá trị đơn hàng (VNĐ)"
        en_name: "Total Amount"
        data_type: "DOUBLE"
        description: "Tổng số tiền thanh toán của đơn hàng sau giảm giá"
        synonyms: ["tổng tiền", "giá trị đơn", "tiền hàng", "doanh thu"]
      created_at:
        name: "created_at"
        vn_name: "Thời điểm đặt hàng"
        en_name: "Order Created Time"
        data_type: "DATETIME"
        description: "Thời gian người mua bấm đặt đơn hàng"
        is_partition_or_dist: true
        synonyms: ["ngày đặt", "thời gian mua", "tháng", "năm"]

  order_items:
    table_name: "order_items"
    vn_name: "Chi tiết đơn hàng"
    description: "Bảng chi tiết các mặt hàng sản phẩm trong mỗi đơn hàng"
    primary_key: ["id"]
    columns:
      id:
        name: "id"
        vn_name: "Mã chi tiết đơn"
        en_name: "Order Item ID"
        data_type: "BIGINT"
        description: "Khóa chính dòng chi tiết"
        is_primary_key: true
      order_id:
        name: "order_id"
        vn_name: "Mã đơn hàng"
        en_name: "Order ID"
        data_type: "BIGINT"
        description: "Khóa ngoại liên kết tới bảng orders"
        foreign_key: "orders.id"
      product_id:
        name: "product_id"
        vn_name: "Mã sản phẩm"
        en_name: "Product ID"
        data_type: "BIGINT"
        description: "Khóa ngoại liên kết tới bảng products"
        foreign_key: "products.id"
      quantity:
        name: "quantity"
        vn_name: "Số lượng mua"
        en_name: "Quantity"
        data_type: "INT"
        description: "Số lượng sản phẩm trong đơn hàng"
        synonyms: ["số lượng", "mấy cái", "số chiếc"]
      unit_price:
        name: "unit_price"
        vn_name: "Đơn giá sản phẩm"
        en_name: "Unit Price"
        data_type: "DOUBLE"
        description: "Đơn giá bán tại thời điểm đặt đơn"
        synonyms: ["đơn giá", "giá sản phẩm"]

  products:
    table_name: "products"
    vn_name: "Sản phẩm"
    description: "Bảng danh mục sản phẩm và ngành hàng"
    primary_key: ["id"]
    columns:
      id:
        name: "id"
        vn_name: "Mã sản phẩm"
        en_name: "Product ID"
        data_type: "BIGINT"
        description: "Khóa chính định danh sản phẩm"
        is_primary_key: true
      product_name:
        name: "product_name"
        vn_name: "Tên sản phẩm"
        en_name: "Product Name"
        data_type: "VARCHAR(255)"
        description: "Tên mô tả của mặt hàng"
        synonyms: ["tên sản phẩm", "mặt hàng", "tên hàng"]
      category_name:
        name: "category_name"
        vn_name: "Danh mục / Ngành hàng"
        en_name: "Category Name"
        data_type: "VARCHAR(100)"
        description: "Ngành hàng (Điện tử, Thời trang, Gia dụng, Mẹ và bé...)"
        synonyms: ["ngành hàng", "danh mục", "nhóm hàng"]
        sample_values: ["Điện tử", "Thời trang", "Gia dụng"]
      category:
        name: "category"
        vn_name: "Ngành hàng sản phẩm"
        en_name: "Category"
        data_type: "VARCHAR(100)"
        description: "Ngành hàng sản phẩm"
        synonyms: ["ngành hàng", "ngành hàng sản phẩm", "danh mục"]

  payments:
    table_name: "payments"
    vn_name: "Thanh toán"
    description: "Bảng thông tin giao dịch thanh toán của đơn hàng"
    primary_key: ["id"]
    columns:
      id:
        name: "id"
        vn_name: "Mã giao dịch"
        en_name: "Payment ID"
        data_type: "BIGINT"
        description: "Khóa chính bản ghi thanh toán"
        is_primary_key: true
      order_id:
        name: "order_id"
        vn_name: "Mã đơn hàng"
        en_name: "Order ID"
        data_type: "BIGINT"
        description: "Khóa ngoại liên kết tới bảng orders"
        foreign_key: "orders.id"
      payment_method:
        name: "payment_method"
        vn_name: "Phương thức thanh toán"
        en_name: "Payment Method"
        data_type: "VARCHAR(50)"
        description: "Hình thức thanh toán: COD, VNPAY, MOMO, CREDIT_CARD"
        synonyms: ["hình thức thanh toán", "phương thức", "cách trả tiền"]
      amount:
        name: "amount"
        vn_name: "Số tiền thanh toán"
        en_name: "Payment Amount"
        data_type: "DOUBLE"
        description: "Số tiền thực trả qua cổng thanh toán"

  fct_orders_monthly_summary:
    table_name: "fct_orders_monthly_summary"
    vn_name: "Báo cáo tổng hợp đơn hàng theo tháng"
    description: "Bảng tổng hợp doanh thu và số lượng đơn hàng theo tháng và trạng thái"
    primary_key: ["report_month", "status"]
    columns:
      report_month:
        name: "report_month"
        vn_name: "Tháng báo cáo"
        en_name: "Report Month"
        data_type: "VARCHAR(7)"
        description: "Tháng báo cáo định dạng YYYY-MM"
        synonyms: ["tháng", "tháng nào", "thời gian", "kỳ báo cáo"]
        sample_values: ["2026-01", "2026-02", "2026-03"]
      status:
        name: "status"
        vn_name: "Trạng thái đơn hàng"
        en_name: "Order Status"
        data_type: "VARCHAR(50)"
        description: "Trạng thái đơn hàng tổng hợp"
        synonyms: ["trạng thái", "tình trạng"]
      total_records:
        name: "total_records"
        vn_name: "Tổng số lượng bản ghi/đơn"
        en_name: "Total Records"
        data_type: "BIGINT"
        description: "Tổng số đơn hàng trong tháng"
        synonyms: ["số lượng đơn", "tổng đơn"]
      total_gross_revenue:
        name: "total_gross_revenue"
        vn_name: "Tổng doanh thu bán hàng"
        en_name: "Total Gross Revenue"
        data_type: "DOUBLE"
        description: "Tổng doanh thu bán hàng gộp trong tháng"
        synonyms: ["doanh thu", "tổng doanh thu", "tiền bán hàng", "doanh thu bán hàng"]
      avg_total_amount:
        name: "avg_total_amount"
        vn_name: "Giá trị đơn hàng trung bình"
        en_name: "Average Order Amount"
        data_type: "DOUBLE"
        description: "Giá trị đơn hàng trung bình trong tháng"

relationships:
  - from_table: "orders"
    from_column: "customer_id"
    to_table: "customers"
    to_column: "id"
    cardinality: "N:1"
    join_type: "LEFT"
    weight: 1.0

  - from_table: "order_items"
    from_column: "order_id"
    to_table: "orders"
    to_column: "id"
    cardinality: "N:1"
    join_type: "INNER"
    weight: 1.0

  - from_table: "order_items"
    from_column: "product_id"
    to_table: "products"
    to_column: "id"
    cardinality: "N:1"
    join_type: "INNER"
    weight: 1.0

  - from_table: "payments"
    from_column: "order_id"
    to_table: "orders"
    to_column: "id"
    cardinality: "N:1"
    join_type: "LEFT"
    weight: 1.0
